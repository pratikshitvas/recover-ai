name: RecoverAI checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx prisma validate --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recoverai
      - run: npm run db:generate
      - run: node --check apps/api/src/index.js
      - run: node --check apps/desktop/main.cjs
      - run: node --check apps/desktop/preload.cjs
      - run: node --check scripts/prepare-desktop.mjs
      - run: npm run build:web
      - run: npm run build:android
      - run: npm run build:ios
      - run: npm run package:desktop:dir
